<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promptyy Thought Playground</title>
  <meta name="description" content="A clean white canvas for your thoughts. Drop cards, move them, resize, and connect ideas." />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Promptyy</span>
      <span class="brand-tagline">Thought Playground • Shift+click cards to connect</span>
    </div>
    <nav class="toolbar">
      <button id="zoomInBtn" class="btn-icon" title="Zoom in">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <button id="zoomOutBtn" class="btn-icon" title="Zoom out">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <button id="addCardBtn" class="btn-icon" title="Add card">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button id="clearCanvasBtn" class="btn-icon" title="Clear all">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </nav>
  </header>

  <main class="canvas-shell">
    <div id="boardViewport" class="board-viewport">
      <div id="board" class="board">
        <svg id="connectionLayer" class="connection-layer"></svg>
        <div id="cardsLayer" class="cards-layer"></div>
      </div>
    </div>
  </main>

  <div id="cardToolbar" class="card-toolbar hidden" role="toolbar" aria-label="Card actions">
    <button id="cardDeleteBtn" class="toolbar-btn" title="Delete">Delete</button>
    <button id="cardColorBtn" class="toolbar-btn" title="Color">Color</button>
  </div>

  <script src="./scripts/main.js"></script>
</body>
</html>
