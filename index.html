<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promptyy - Visual Idea Organization</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⚡</text></svg>">
    <link rel="stylesheet" href="styles/main.css">
    
    <!-- Google Analytics -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LMWQ99DM6J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-LMWQ99DM6J');
    </script>
</head>
<body class="index-page">
    <!-- Floating Header Bar -->
    <div class="floating-bar">
        <!-- Left Section: Logo and Brand -->
        <div class="bar-left">
            <div class="logo-section">
                <a href="home.html" class="logo-link">
                    <div class="logo">⚡</div>
                    <span class="brand-name">Promptyy</span>
                </a>
            </div>
        </div>

        <!-- Center Section: Action Buttons -->
        <div class="bar-center">
            <button class="action-btn-add" title="Add">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <button class="action-btn-delete" title="Delete">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3,6 5,6 21,6"></polyline>
                    <path d="m19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"></path>
                </svg>
            </button>
            <button class="action-btn-menu" title="Menu" id="mobile-menu-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Right Section: Zoom Controls -->
        <div class="bar-right">
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-out" title="Zoom Out">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M4 8h8v1H4V8z"/>
                    </svg>
                </button>
                <span class="zoom-level">100%</span>
                <button class="zoom-btn" id="zoom-in" title="Zoom In">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M7 4v3H4v2h3v3h2V9h3V7h-3V4H7z"/>
                    </svg>
                </button>
                <button class="zoom-btn" id="fit-screen" title="Fit Screen">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M1.5 1.5h4v1h-4v4h-1v-5h5v1zM10.5 1.5h4v5h-1v-4h-4v-1h5zM14.5 14.5h-4v-1h4v-4h1v5h-5v-1zM5.5 14.5h-4v-5h1v4h4v1h-5v-1z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Instructions -->
    <div class="instructions">
        <span class="instruction-text desktop-text">Hold Shift and click two cards to connect them</span>
        <span class="instruction-text mobile-text">Tap Connect button, then tap two cards to connect</span>
        <div class="mobile-connection-buttons">
            <button class="mobile-connect-btn" id="mobile-connect-btn" title="Connect Cards">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                <span class="btn-text">Connect</span>
            </button>
            <button class="mobile-disconnect-btn" id="mobile-disconnect-btn" title="Disconnect Cards">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <span class="btn-text">Disconnect</span>
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="canvas-area">
            <!-- Your canvas content will go here -->
        </div>
    </main>

    <script src="scripts/main.js"></script>
</body>
</html>
